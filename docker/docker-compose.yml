services:
  rtsm-dev:
    image: rtsm-dev:gpu-working
    container_name: rtsm-dev
    runtime: nvidia
    restart: unless-stopped
    working_dir: /workspace/rtsm
    ports:
      - "8002:8002"
      - "8765:8765"
    volumes:
      - /home/peep/rtsm:/workspace/rtsm
      - /mnt/rtsm-data/model_store:/mnt/rtsm-data/model_store
      - /mnt/rtsm-data/cache:/root/.cache
      - /mnt/rtsm-data/rtsm-workdir:/workspace/workdir
      - /mnt/rtsm-data/rtsm-recordings:/mnt/rtsm-data/rtsm-recordings
    environment:
      RTSM_MODE: ${RTSM_MODE:-live}
    command: ["/workspace/rtsm/scripts/entrypoint.sh"]

  rtsm-ingest:
    image: rtsm-ingest:skeleton
    container_name: rtsm-ingest
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      - rtsm-dev
    environment:
      ROS_DOMAIN_ID: 30
      ROS_LOCALHOST_ONLY: 0
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///cyclonedds.xml
    volumes:
      - /home/peep/cyclonedds.xml:/cyclonedds.xml:ro
      - /home/peep/rtsm/ingest:/workspace/rtsm-ingest
      - /mnt/rtsm-data/rtsm-recordings:/recordings
    command:
      - python3
      - /workspace/rtsm-ingest/src/subscriber.py
      - --post-to=http://localhost:8002/ingest/keyframe
      - --post-hz=6
      - --camera-frame=realsense_color_optical_frame
